server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.aobihelper.xyz;

    ssl_certificate /etc/letsencrypt/live/aobihelper.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aobihelper.xyz/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:AOBI_SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    return 301 https://aobihelper.xyz$request_uri;
}

