version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: aobihelper-mysql
    environment:
      MYSQL_ROOT_PASSWORD: change_me
      MYSQL_DATABASE: aobi_helper
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:7.2
    container_name: aobihelper-redis
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    container_name: aobihelper-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  mysql-data:
  minio-data:
