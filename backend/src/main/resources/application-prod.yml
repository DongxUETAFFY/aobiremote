spring:
  datasource:
    url: ${AOBI_DB_URL}
    username: ${AOBI_DB_USERNAME}
    password: ${AOBI_DB_PASSWORD}
  data:
    redis:
      host: ${AOBI_REDIS_HOST}
      port: ${AOBI_REDIS_PORT:6379}
      password: ${AOBI_REDIS_PASSWORD:}
  mail:
    host: ${AOBI_MAIL_HOST}
    port: ${AOBI_MAIL_PORT:465}
    username: ${AOBI_MAIL_USERNAME}
    password: ${AOBI_MAIL_PASSWORD}
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: ${AOBI_MAIL_SMTP_AUTH:true}
          ssl:
            enable: ${AOBI_MAIL_SMTP_SSL_ENABLE:true}
            trust: ${AOBI_MAIL_SMTP_SSL_TRUST:${AOBI_MAIL_HOST}}

management:
  health:
    mail:
      enabled: false

sa-token:
  token-name: Authorization
  token-prefix: Bearer
  is-read-header: true
  is-read-cookie: false

app:
  admin:
    emails: ${AOBI_ADMIN_EMAILS:admin@aobi.local}
  auth:
    mail-enabled: true
    verification-code-expire-seconds: 300
    verification-code-send-interval-seconds: 60
    verification-code-hour-limit: 10
    login-fail-limit: 5
    login-fail-window-seconds: 600
    dev-log-verification-code: false
  cors:
    allowed-origins: ${AOBI_CORS_ALLOWED_ORIGINS:https://your-domain.example}
  minio:
    endpoint: ${AOBI_MINIO_ENDPOINT}
    access-key: ${AOBI_MINIO_ACCESS_KEY}
    secret-key: ${AOBI_MINIO_SECRET_KEY}
    bucket-name: ${AOBI_MINIO_BUCKET}
  file:
    local-root: ${APP_FILE_LOCAL_ROOT:./.local-data/uploads}
    max-image-bytes: ${APP_FILE_MAX_IMAGE_BYTES:614400}
    max-concurrent-image-stores: ${APP_FILE_MAX_CONCURRENT_IMAGE_STORES:20}
