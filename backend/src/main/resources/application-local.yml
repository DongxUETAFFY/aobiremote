spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3307/aobi_helper?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: change_me
  sql:
    init:
      mode: always
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
  mail:
    host: smtp.example.com
    port: 465
    username: no-reply@example.com
    password: change_me
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 2592000
  active-timeout: 86400
  is-share: false
  token-style: random-64
  is-read-header: true
  is-read-cookie: false

app:
  auth:
    mail-enabled: false
    verification-code-expire-seconds: 300
    verification-code-send-interval-seconds: 60
    verification-code-hour-limit: 10
    login-fail-limit: 5
    login-fail-window-seconds: 600
    dev-log-verification-code: true
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://127.0.0.1:5173
  minio:
    endpoint: http://127.0.0.1:9000
    access-key: minioadmin
    secret-key: minioadmin
    bucket-name: aobi-helper-local
  file:
    local-root: ./.local-data/uploads
    max-image-bytes: 614400
