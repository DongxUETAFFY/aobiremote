spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/aobi_helper_test?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: change_me
  sql:
    init:
      mode: always
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 1

sa-token:
  token-prefix: Bearer

app:
