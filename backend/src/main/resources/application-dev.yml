spring:
  datasource:
    url: jdbc:mysql://localhost:3306/aobi_helper?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
  sql:
    init:
      mode: never
  data:
    redis:
      host: localhost
      port: 6379
  mail:
    host: localhost
    port: 25

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 2592000
  active-timeout: 86400
  is-share: false
  token-style: random-64
  is-read-header: true
  is-read-cookie: false

app:
  auth:
    mail-enabled: false
    verification-code-expire-seconds: 300
    verification-code-send-interval-seconds: 60
    verification-code-hour-limit: 10
    login-fail-limit: 5
    login-fail-window-seconds: 600
    dev-log-verification-code: true
    cache:
      type: memory
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://localhost:5174
      - http://127.0.0.1:5173
      - http://127.0.0.1:5174
  minio:
    endpoint: http://localhost:9000
    access-key: minioadmin
    secret-key: minioadmin
    bucket-name: aobi-helper-local
  file:
    local-root: ./.local-data/uploads
    max-image-bytes: 614400
